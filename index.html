<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <main>
            <form id="mainForm">
                <h1>Cadastro dos produtos</h1>

                <label for="nome">Nome do produto:</label>
                <input id="nome" type="text" required>

                <label for="descricao">Descrição de produto:</label>
                <input id="descricao" type="text">

                <label for="marca">Marca:</label>
                <input id="marca" type="text">

                <label for="categoria">Categoria:</label>
                <input id="categoria" type="text">

                <label for="preco">Preço:</label>
                <input id="preco" type="text">

                <label for="estoque">Em estoque:</label>
                <input id="estoque" type="text">

                <label for="cor">Cor:</label>
                <input id="cor" type="text">

                <label for="tamanho">Tamanho:</label>
                <input id="tamanho" type="text">

                <label for="idProduto">Código do produto:</label>
                <input id="idProduto" type="text">

                <button type="submit">Cadastrar</button>

            </form>
            
            <script src="script.js"></script>

        </main>
    </div>
</body>
</html>
